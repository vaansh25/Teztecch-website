<div class="form-title">Send Us a Message</div>
<form id="contactForm" action="https://formbold.com/s/3VaE0" method="POST">
  <div class="form-grid">
    <div class="form-group">
      <label for="fullName">Full Name</label>
      <input id="fullName" name="full_name" type="text" placeholder="Your full name" autocomplete="name" required>
    </div>
    <div class="form-group">
      <label for="emailAddress">Email Address</label>
      <input id="emailAddress" name="email" type="email" placeholder="your@email.com" autocomplete="email" required>
    </div>
    <div class="form-group">
      <label for="phoneNumber">Phone Number</label>
      <input id="phoneNumber" name="phone" type="tel" placeholder="+91 XXXXX XXXXX" autocomplete="tel" required>
    </div>
    <div class="form-group">
      <label for="companyName">Company Name</label>
      <input id="companyName" name="company_name" type="text" placeholder="Your company" autocomplete="organization">
    </div>
    <div class="form-group">
      <label for="serviceRequired">Service Required</label>
      <select id="serviceRequired" name="service_required" required>
        <option value="">Select a Service</option>
        <option>Website Development</option>
        <option>Mobile App Development</option>
        <option>Digital Marketing (SEO, Social Media &amp; Ads)</option>
        <option>Graphics Designing &amp; Branding</option>
        <option>SMS Marketing</option>
        <option>Animated Videos</option>
        <option>Email Marketing</option>
        <option>WhatsApp Marketing</option>
        <option>Software Development</option>
        <option>Online PR</option>
        <option>E-commerce Development</option>
        <option>Influencer &amp; Celebrity Marketing</option>
      </select>
    </div>
    <div class="form-group">
      <label for="projectType">Project Type</label>
      <select id="projectType" name="project_type" required>
        <option value="">Select Project Type</option>
        <option>One-time Project</option>
        <option>Ongoing Project</option>
        <option>Long-term Partnership</option>
        <option>Not Sure Yet</option>
      </select>
    </div>
    <div class="form-group full">
      <label for="projectDescription">Project Description</label>
      <textarea id="projectDescription" name="message" placeholder="Tell us about your project requirements, target audience, preferences, and any specific goals..." required></textarea>
    </div>
  </div>
  <button class="submit-btn" type="submit" id="submitMessage">✦ Send Message &amp; Get Free Consultation</button>
  <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
</form>
